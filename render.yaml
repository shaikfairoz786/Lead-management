services:
  # -------------------------------------------------------------
  # Backend Web Service (Node.js + Express + Prisma)
  # -------------------------------------------------------------
  - type: web
    name: automotive-lms-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && node dist/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: '*'
      - key: DATABASE_URL
        fromDatabase:
          name: automotive-lms-db
          property: connectionString

# -------------------------------------------------------------
# Managed PostgreSQL Database
# -------------------------------------------------------------
databases:
  - name: automotive-lms-db
    region: oregon
    plan: free
    databaseName: lead_management
    user: postgres
